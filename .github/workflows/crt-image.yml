# Build the CRT front end and publish it to this repo's container registry.
#
# Deliberately manual: run it from the Actions tab, or push a v* tag. Flip on
# the `push:` block below if you would rather every change to crt/ publish.
name: crt image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # push:
  #   branches: [main]
  #   paths: ["crt/**", ".github/workflows/crt-image.yml"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/retroguide-crt

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # what lets GITHUB_TOKEN push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # A Pi is arm; the runner is x86. QEMU is what makes the arm builds
      # possible here rather than on the Pi itself.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: ./crt
          # arm64 covers Pi 4/5 and a 64-bit Pi OS; arm/v7 covers a 32-bit
          # install and older boards.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "First publish only: make the package public at" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/users/${{ github.repository_owner }}/packages" >> $GITHUB_STEP_SUMMARY
