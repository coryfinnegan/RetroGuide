# Android / Google TV build: compiles the debug APK on every change to
# android/ and keeps it as a downloadable artifact for 14 days, so a PR's build
# can be sideloaded without building it locally.
name: android

# Runs on every pull request and push to main, so the check always
# reports and can be marked required. The `changes` job decides whether
# anything under its paths changed; when nothing did, `android` is
# skipped, which GitHub counts as passing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - 'android/**'
              - '.github/workflows/android.yml'

  android:
    needs: changes
    if: needs.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The Gradle plugin needs 17+; the runner's default java is older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner ships the Android SDK and exports ANDROID_HOME, which stands
      # in for the gitignored local.properties.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: retroguide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
