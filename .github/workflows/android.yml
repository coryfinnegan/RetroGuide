# Android / Google TV build: compiles the debug APK on every change to
# android/ and keeps it as a downloadable artifact for 14 days, so a PR's build
# can be sideloaded without building it locally.
name: android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The Gradle plugin needs 17+; the runner's default java is older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The runner ships the Android SDK and exports ANDROID_HOME, which stands
      # in for the gitignored local.properties.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: retroguide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
